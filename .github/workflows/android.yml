name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          mkdir -p /tmp/keep
          cp -r lib assets /tmp/keep/
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create . --platforms android --org com.alfaham --project-name apps_store
          rm -rf lib assets
          cp -r /tmp/keep/lib /tmp/keep/assets .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          python3 tools/prepare_android.py

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/store-key.jks"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/android/app/store-key.jks"
            } > android/key.properties
            echo "تم تفعيل التوقيع بمفتاحك."
          else
            echo "::warning::لا يوجد مفتاح توقيع في Secrets، سيُوقَّع الـ APK بمفتاح debug (لا يصلح للتحديث المستمر)."
          fi

      - run: flutter pub get

      - name: App icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename files
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "store-${f#app-}"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: store-apk
          path: build/app/outputs/flutter-apk/store-*-release.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/store-*-release.apk
